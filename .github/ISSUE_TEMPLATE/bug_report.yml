name: Bug report
description: Report a reproducible TubeCraft Studio problem.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the exact error and what you expected.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: Deployment URL / version
